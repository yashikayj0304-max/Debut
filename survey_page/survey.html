<title>Debut Feedback</title><meta name="robots" content="noindex"><!--SHIM-->
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">
<style>
/* Layout: one calm column. Real screens of the app sit inside the questions, so people react to what they see, not to a description. */
:root{--bg:#f7f4ff;--card:#ffffff;--ink:#1b1433;--mut:#6b6690;--line:#e3dcf7;--pri:#7c5cd6;--pri2:#ece6fb;--on:#ffffff;--out:#1b1433;--good:#0d9488;--warn:#f59e0b;--bad:#e11d48;--sun:#ffd60a;
 --fd:"Bricolage Grotesque","DM Sans",system-ui,sans-serif;--fb:"DM Sans",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f0d1a;--card:#1a1730;--ink:#f1ecff;--mut:#a39cc9;--line:#322c55;--pri:#9b82ee;--pri2:#2a2450;--on:#12091f;--out:#6c5bb5;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f0d1a;--card:#1a1730;--ink:#f1ecff;--mut:#a39cc9;--line:#322c55;--pri:#9b82ee;--pri2:#2a2450;--on:#12091f;--out:#6c5bb5;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--fb);padding-block:20px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;display:grid;gap:16px}
h1,h2,h3{font-family:var(--fd);letter-spacing:-.02em;margin:0;text-wrap:balance}
h1{font-size:clamp(28px,6vw,40px);line-height:1.05;font-weight:800}
.hero{display:flex;gap:16px;align-items:center}.hero p{margin:6px 0 0;color:var(--mut)}.deb{flex:none;width:84px;height:84px}
.tabs{display:flex;gap:8px}.tab{font:700 14px var(--fb);padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tab[aria-selected=true]{background:var(--pri);color:var(--on);border-color:var(--out);box-shadow:2px 2px 0 var(--out)}
.prog{position:sticky;top:env(safe-area-inset-top,0px);z-index:3;height:8px;border-radius:99px;background:var(--pri2);overflow:hidden}.prog i{display:block;height:100%;width:0;background:var(--pri);transition:width .3s}
.card{background:var(--card);border:1.5px solid var(--out);border-radius:20px;padding:20px;box-shadow:3px 3px 0 var(--out)}
.sec-h{display:flex;gap:12px;align-items:center;margin-bottom:6px}.sec-h h2{font-size:21px}.sec-h small{display:block;color:var(--mut);font-size:13px}
.n{width:32px;height:32px;border-radius:50%;background:var(--pri);color:var(--on);display:grid;place-items:center;font-weight:700;flex:none}
.lead{color:var(--mut);margin:0 0 14px;font-size:15px}
fieldset{border:0;margin:0 0 22px;padding:0;min-width:0}legend{font-weight:700;margin-bottom:8px;padding:0}
.task{background:var(--pri2);border-radius:14px;padding:10px 14px;margin-bottom:10px;font-size:14.5px}.task b{font-weight:700}
input[type=radio],input[type=checkbox]{position:absolute;opacity:0;width:1px;height:1px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chip span{display:inline-block;padding:7px 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--card);cursor:pointer;transition:transform .12s}.chip:hover span{transform:translateY(-1px)}
.chip input:checked+span{background:var(--pri);color:var(--on);border-color:var(--out);box-shadow:2px 2px 0 var(--out)}
.chip input:disabled+span{opacity:.4;cursor:not-allowed}
.faces{display:flex;gap:8px}.faces span{display:grid;place-items:center;width:52px;height:52px;font-size:28px;border:1.5px solid var(--line);border-radius:16px;background:var(--card);cursor:pointer;filter:grayscale(.85);transition:transform .15s cubic-bezier(.3,1.8,.5,1)}
.faces input:checked+span{filter:none;background:var(--pri2);border-color:var(--out);box-shadow:2px 2px 0 var(--out);transform:scale(1.1)}
.faces.sm span{width:38px;height:38px;font-size:19px;border-radius:12px}
.ends{display:flex;justify-content:space-between;max-width:300px;color:var(--mut);font-size:12.5px;margin-top:4px}
.nps{display:flex;flex-wrap:wrap;gap:5px}.nps span{display:grid;place-items:center;width:42px;height:42px;border:1.5px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;font-weight:700}
.nps input:checked+span{background:var(--pri);color:var(--on);border-color:var(--out);box-shadow:2px 2px 0 var(--out)}
input:focus-visible+span{outline:2px solid var(--pri);outline-offset:2px}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:10px 12px}textarea:focus{outline:2px solid var(--pri);border-color:var(--pri)}
.btn{font:700 15px var(--fb);padding:11px 22px;border-radius:999px;border:1.5px solid var(--out);background:var(--pri);color:var(--on);box-shadow:2px 2px 0 var(--out);cursor:pointer;transition:transform .12s}
.btn:active{transform:translate(2px,2px);box-shadow:none}.btn.ghost{background:var(--card);color:var(--ink)}.btn:disabled{opacity:.5;cursor:not-allowed}
.send{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.muted,small{color:var(--mut)}
.done{text-align:center;display:grid;gap:10px;justify-items:center}
pre{white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:12px;font:13px/1.5 ui-monospace,Menlo,monospace;margin:0;max-height:260px;overflow:auto;text-align:left;width:100%}
/* screenshots */
.shot{position:relative;border:1.5px solid var(--out);border-radius:14px;overflow:hidden;background:var(--bg);line-height:0}
.shot img{width:100%;height:auto;display:block}
.shot.click{cursor:crosshair}.shot.click img{user-select:none;-webkit-user-drag:none}
.dot{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:var(--bad);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.4);pointer-events:none;animation:pop .25s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.five{display:grid;gap:12px;justify-items:center;text-align:center}
.cover{display:grid;place-items:center;aspect-ratio:1100/688;width:100%;border:1.5px dashed var(--line);border-radius:14px;background:var(--pri2);color:var(--mut);padding:16px}
.timer{position:absolute;right:12px;top:12px;background:var(--ink);color:var(--bg);font:800 20px var(--fd);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;line-height:1}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ab label{display:grid;gap:8px;cursor:pointer}.ab .shot{transition:transform .15s}.ab label:hover .shot{transform:translateY(-2px)}
.ab input:checked+.shot{border-color:var(--pri);box-shadow:0 0 0 3px var(--pri)}.ab b{text-align:center;font-size:14px}
.sem{display:grid;grid-template-columns:minmax(70px,1fr) minmax(0,2.2fr) minmax(70px,1fr);gap:10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--line);font-size:14px}.sem>span:first-child{text-align:right;color:var(--mut)}.sem>span:last-child{color:var(--mut)}
.dots7{display:flex;justify-content:space-between;gap:4px}.dots7 span{display:block;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--card);cursor:pointer}.dots7 input:checked+span{background:var(--pri);border-color:var(--out);box-shadow:2px 2px 0 var(--out)}
.scr{display:grid;grid-template-columns:200px 1fr;gap:14px;padding:12px 0;border-bottom:1px dashed var(--line);align-items:start}.scr .shot{border-radius:10px}.scr h3{font-size:16px;margin-bottom:6px}
.phones{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}.phones .shot{width:180px;border-radius:22px;border-width:3px}
.stack{display:grid;gap:14px}
/* results */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--card);border:1.5px solid var(--out);border-radius:18px;padding:14px 16px;box-shadow:3px 3px 0 var(--out)}.stat b{display:block;font:800 34px var(--fd);line-height:1.1}.stat span{color:var(--mut);font-size:13px}
.bar-row{display:grid;grid-template-columns:minmax(110px,38%) 1fr 36px;gap:10px;align-items:center;margin:7px 0;font-size:14px}.bar-row>span{min-width:0}
.bar{height:12px;border-radius:99px;background:var(--pri2);overflow:hidden}.bar i{display:block;height:100%;background:var(--pri);border-radius:99px}.bar.bad i{background:var(--bad)}.bar.ok i{background:var(--good)}
.col{display:flex;gap:5px;align-items:flex-end;height:110px;margin-top:10px}.col div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:2px;font-size:11px;color:var(--mut)}.col i{width:100%;min-height:3px;border-radius:6px 6px 0 0;background:var(--pri)}.col i.d{background:var(--bad)}.col i.p{background:var(--warn)}.col i.g{background:var(--good)}
.quote{margin:8px 0;padding:8px 12px;background:var(--pri2);border-radius:12px}.hd{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.heat{position:absolute;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;background:rgba(225,29,72,.38);border:2px solid rgba(225,29,72,.8);pointer-events:none}
@media (max-width:560px){.faces span{width:46px;height:46px}.nps span{width:36px;height:36px}.hero{flex-direction:column;text-align:center}.scr{grid-template-columns:1fr}.ab{gap:8px}.sem{grid-template-columns:1fr;gap:4px}.sem>span:first-child{text-align:left}.bar-row{grid-template-columns:1fr 36px}.bar-row .bar{grid-column:1/-1;order:3}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

    <div><h1>Be our first eyes</h1><p>You have never seen this app, and that is the point. You will look at a few screens, click where you would click and tell us what you think. About 15 minutes (skip anything you like), skip anything you cannot answer. We are testing the design, not you.</p></div>

</div>
