
<script>(function(){var t=document.querySelector(".lp-tabs");if(!t)return;t.addEventListener("click",function(e){var b=e.target.closest("[data-w]");if(!b)return;t.querySelectorAll(".lp-tab").forEach(function(c){c.classList.toggle("on",c===b);});document.querySelectorAll(".lp-pane").forEach(function(p){p.hidden=p.dataset.w!==b.dataset.w;});});})();</script>
<dialog id="featDlg" class="featdlg"><button type="button" class="fd-x" aria-label="Close" onclick="this.closest('dialog').close()">✕</button><div id="fdBody"></div></dialog>
<script>
var FEATS={
calendar:["📅","Content calendar","Drag it, drop it, done.",["Drag to reschedule","Festival dates built in","Sync to Google"]],
boards:["🖼️","Mood boards","Vibe it before you make it.",["Images and swatches","Share a link","Ready templates"]],
gtm:["🚀","Launch and GTM","Launch like you mean it.",["Plans and personas","8-phase checklist","Your brand kit"]],
contentops:["✍️","Content Ops","Creators, briefs and payouts, sorted.",["Brief matching","Review rounds","Margins stay private"]],
influencers:["🤳","Influencers and PR","Slide into the right DMs.",["Find people","Track replies","Outreach templates"]],
promos:["🎪","Promotions and events","Plan the drop, track the ROI.",["Auto checklists","Budgets","On your calendar"]],
ai:["🤖","AI Studio","First drafts in seconds.",["Copy and briefs","Knows your brand","Cites its sources"]],
kpis:["📈","KPIs and links","Know what is working.",["Trackable links","KPI vs target","Health score"]],
pulse:["📡","Live Market Pulse","Know before everyone else.",["Live headlines","Trending topics","Competitor watch"]],
collab:["💬","Collaboration","Everyone on the same page.",["@mentions","Approvals","Daily digest"]],
reports:["📑","Client reports","Your month, on one page.",["One-click PDF","Share link","Client portal"]],
api:["🔌","Integrations and API","Plays nice with your tools.",["Lead form","API keys","Zapier and Make"]],
security:["🔐","Secure by design","Your work stays yours.",["2-step login","Roles","Audit log"]],
mobile:["📱","On your phone","Fits in your pocket.",["Install it","Thumb-friendly","Light and dark"]],
group:["👑","Group mode","Lead without the mess.",["Approvals","Balanced workload","Client portals"]]};
(function(){var d=document.getElementById("featDlg"),b=document.getElementById("fdBody");
var ICM={'🤖':'bot','📈':'chart','📡':'radar','💬':'chat','📑':'doc','🔌':'plug','🔐':'lock','📱':'phone','👑':'crown','🖼':'img','🚀':'rocket','✍':'note','🤳':'camera','🎪':'event','📅':'cal'};function icn(e){return '<i class="ic ic-'+(ICM[String(e).replace(/\uFE0F/g,'')]||'sparkle')+'" aria-hidden="true"></i>';}
function esc(t){return String(t).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
function show(k){var f=FEATS[k];if(!f)return;var ks=Object.keys(FEATS),n=ks.length,ix=ks.indexOf(k),pv=ks[(ix+n-1)%n],nx=ks[(ix+1)%n];b.innerHTML='<div class="fd-ic">'+icn(f[0])+'</div><h2>'+esc(f[1])+'</h2><p class="fd-lead">'+esc(f[2])+'</p><div class="fd-cta"><a class="btn" href="{{ url_for('auth.signup') }}">Try it free</a> <a class="btn ghost" href="{{ url_for('demo') }}">See it live</a></div><div class="fd-step"><button type="button" class="fd-arrow" data-f="'+pv+'" aria-label="Previous: '+esc(FEATS[pv][1])+'">‹</button><span>'+(ix+1)+' of '+n+'</span><button type="button" class="fd-arrow" data-f="'+nx+'" aria-label="Next: '+esc(FEATS[nx][1])+'">›</button></div>';if(!d.open)d.showModal();}
document.addEventListener("click",function(e){var t=e.target.closest("[data-f]");if(t&&(t.closest(".chips")||t.closest(".bento")||t.closest(".fcard")||t.closest("#featDlg")))show(t.dataset.f);else if(e.target===d)d.close();});
document.addEventListener("keydown",function(e){if((e.key==="Enter"||e.key===" ")&&e.target.classList&&e.target.classList.contains("fcard")){e.preventDefault();show(e.target.dataset.f);}});
})();
</script>
