
<script>(function(){var t=document.querySelector(".lp-tabs");if(!t)return;t.addEventListener("click",function(e){var b=e.target.closest("[data-w]");if(!b)return;t.querySelectorAll(".lp-tab").forEach(function(c){c.classList.toggle("on",c===b);});document.querySelectorAll(".lp-pane").forEach(function(p){p.hidden=p.dataset.w!==b.dataset.w;});});})();</script>

(function(){var d=document.getElementById("featDlg"),b=document.getElementById("fdBody");
