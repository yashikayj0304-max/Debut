{% extends "base.html" %}{% set bare = True %}{% block title %}Two-factor login{% endblock %}{% block body %}
<div class="authbox card"><h1>Two-factor code</h1><p class="muted">Enter the 6-digit code from your authenticator app, or one of your recovery codes.</p>
<form method="post"><label>Code<input name="code" inputmode="numeric" autocomplete="one-time-code" autofocus required></label><button class="btn">Verify</button></form>
<p class="muted"><a href="{{ url_for('auth.login') }}">Start over</a></p></div>{% endblock %}
