{% extends "base.html" %}{% block body %}<div class="head"><h1>🔎 Search</h1></div>
<form class="filters" method="get"><input name="q" value="{{ term }}" placeholder="Search everything…" autofocus><button class="btn">Search</button></form>
{% for key, m, rows, tf in results %}<div class="card"><b>{{ m.icon }} {{ m.title }}</b>{% for r in rows %}<div style="padding:4px 0"><a href="{{ url_for('m_edit', key=key, rid=r['id']) }}">{{ r[tf] or '(untitled)' }}</a></div>{% endfor %}</div>
{% else %}{% if term %}<p class="muted">No results for “{{ term }}”.</p>{% endif %}{% endfor %}
{% endblock %}
